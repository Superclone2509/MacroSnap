<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MacroSnap">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>MacroSnap</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --accent: #22d3ee;
    --accent2: #a78bfa;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --green: #4ade80;
    --orange: #fb923c;
    --red: #f87171;
    --teal: #2dd4bf;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh; padding: 0 16px 100px;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header { text-align: center; padding: 20px 0 12px; }
  .header h1 { font-size: 24px; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 13px; color: var(--text2); margin-top: 2px; }

  /* Settings (collapsible) */
  .setup { background: var(--surface); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
  .setup-header {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-size: 15px; font-weight: 600;
  }
  .setup-header .chev { color: var(--text2); font-size: 13px; }
  .setup-body { margin-top: 14px; }
  .setup label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px; }
  .setup input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--surface2);
    background: var(--bg); color: var(--text); font-size: 15px; outline: none;
  }
  .setup input:focus { border-color: var(--accent); }
  .setup select {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--surface2);
    background: var(--bg); color: var(--text); font-size: 15px; outline: none;
    margin-top: 10px; -webkit-appearance: none; appearance: none;
  }
  .setup select:focus { border-color: var(--accent); }
  .setup .hint { font-size: 12px; color: var(--text2); margin-top: 8px; line-height: 1.4; }
  .setup .hint a { color: var(--accent); }
  .target-row { display: flex; gap: 10px; }
  .target-row input { flex: 1; min-width: 0; }

  /* Templates (quick log) */
  .templates { margin-bottom: 16px; }
  .templates h3 { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--surface2); color: var(--text);
    padding: 9px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    margin: 0 8px 8px 0; cursor: pointer;
  }
  .chip:active { opacity: 0.8; }
  .chip-x { color: var(--text2); font-size: 13px; padding: 0 2px; }

  /* Description input */
  .desc-area { margin-bottom: 16px; position: relative; }
  .desc-clear {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: var(--surface2); color: var(--text2);
    font-size: 13px; line-height: 26px; text-align: center; cursor: pointer;
    display: none;
  }
  .desc-clear.visible { display: block; }
  .desc-area textarea {
    width: 100%; padding: 12px; padding-right: 42px; border-radius: 10px; border: 1px solid var(--surface2);
    background: var(--surface); color: var(--text); font-size: 14px; outline: none;
    resize: none; font-family: inherit; min-height: 44px; max-height: 120px;
  }
  .desc-area textarea::placeholder { color: var(--text2); }
  .desc-area textarea:focus { border-color: var(--accent); }

  /* Camera buttons */
  .capture-area { text-align: center; margin: 16px 0; }
  .capture-btn {
    width: 100%; padding: 16px; border-radius: var(--radius);
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    color: white; font-size: 17px; font-weight: 600; border: none;
    cursor: pointer; position: relative; overflow: hidden;
  }
  .capture-btn:active { opacity: 0.85; transform: scale(0.98); }
  .capture-btn.loading { opacity: 0.7; pointer-events: none; }
  .library-btn {
    margin-top: 10px;
    background: var(--surface); border: 1px solid var(--surface2);
  }
  input[type="file"] { display: none; }

  /* Preview */
  .preview-container { margin: 16px 0; display: none; }
  .preview-container.visible { display: block; }
  .preview-container img {
    width: 100%; border-radius: var(--radius); max-height: 300px; object-fit: cover;
  }

  /* Results card */
  .results { display: none; margin: 16px 0; }
  .results.visible { display: block; }
  .results-card {
    background: var(--surface); border-radius: var(--radius); padding: 20px;
  }
  .meal-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .meal-desc { font-size: 13px; color: var(--text2); margin-bottom: 16px; line-height: 1.4; }
  .calories-row {
    text-align: center; padding: 16px 0; margin-bottom: 16px;
    background: var(--bg); border-radius: 12px;
  }
  .calories-num { font-size: 42px; font-weight: 800; color: var(--accent); }
  .calories-label { font-size: 13px; color: var(--text2); }
  .macros-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .macro-item {
    text-align: center; padding: 12px 4px; border-radius: 12px; background: var(--bg);
  }
  .macro-value { font-size: 20px; font-weight: 700; }
  .macro-label { font-size: 10px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .macro-item.carbs .macro-value { color: var(--orange); }
  .macro-item.protein .macro-value { color: var(--green); }
  .macro-item.fat .macro-value { color: var(--accent2); }
  .macro-item.fiber .macro-value { color: var(--teal); }

  /* Confidence */
  .confidence { margin-top: 12px; font-size: 12px; color: var(--text2); text-align: center; }

  /* Portion selector */
  .portion-row { margin-top: 14px; }
  .portion-label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .portion-btns { display: flex; gap: 6px; }
  .portion-btn {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--surface2);
    background: var(--bg); color: var(--text2); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .portion-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

  /* Items breakdown */
  .items-list { margin-top: 16px; }
  .items-list h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text2); }
  .food-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--surface2);
  }
  .food-item:last-child { border-bottom: none; }
  .food-item-name { font-size: 14px; }
  .food-item-cals { font-size: 14px; color: var(--text2); }

  /* Action buttons */
  .health-btn {
    width: 100%; padding: 14px; border-radius: 12px; margin-top: 14px;
    background: linear-gradient(135deg, #ff2d55, #ff6b8a);
    color: white; font-size: 15px; font-weight: 600; border: none; cursor: pointer;
  }
  .health-btn:active { opacity: 0.85; transform: scale(0.98); }
  .health-btn.logged { background: var(--surface2); pointer-events: none; }
  .action-row { display: flex; gap: 10px; margin-top: 10px; }
  .secondary-btn {
    flex: 1; padding: 12px; border-radius: 12px;
    background: var(--surface2); color: var(--text);
    font-size: 14px; font-weight: 600; border: none; cursor: pointer;
  }
  .secondary-btn:active { opacity: 0.8; }
  .reanalyze-btn { width: 100%; margin-top: 10px; }

  /* Log */
  .log-section { margin-top: 24px; }
  .log-section h2 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .log-entry {
    background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .log-entry-left { flex: 1; min-width: 0; }
  .log-entry-name { font-size: 15px; font-weight: 600; }
  .log-entry-time { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .log-entry-right { text-align: right; }
  .log-entry-cals { font-size: 18px; font-weight: 700; color: var(--accent); }
  .log-entry-macros { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .entry-actions { display: flex; flex-direction: column; gap: 6px; margin-left: 10px; }
  .entry-btn {
    background: var(--surface2); border: none; color: var(--text2);
    width: 30px; height: 30px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .log-empty { text-align: center; color: var(--text2); padding: 30px; font-size: 14px; }

  /* Daily total */
  .daily-total {
    background: linear-gradient(135deg, rgba(14,165,233,0.15), rgba(139,92,246,0.15));
    border: 1px solid var(--surface2);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px; text-align: center;
  }
  .daily-total-label { font-size: 13px; color: var(--text2); }
  .daily-total-num { font-size: 28px; font-weight: 800; color: var(--accent); }
  .daily-total-macros { font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* Progress bars */
  .progress-row { margin-top: 12px; text-align: left; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text2); margin-bottom: 4px;
  }
  .progress-bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 4px; width: 0%;
    background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
    transition: width 0.3s ease;
  }
  .progress-fill.over { background: var(--orange); }

  /* Day navigation */
  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .log-header h2 { margin-bottom: 0 !important; }
  .day-nav {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--surface2);
    background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer;
  }
  .day-nav:disabled { opacity: 0.3; pointer-events: none; }

  /* Weekly trends */
  .week-section { margin-top: 28px; }
  .week-section h2 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .week-summary {
    background: var(--surface); border-radius: 12px; padding: 14px;
    font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 12px;
  }
  .week-summary b { color: var(--text); }
  .week-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .wt-btn {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--surface2);
    background: var(--bg); color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .wt-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
  #weekChart { background: var(--surface); border-radius: 12px; padding: 10px 6px 4px; }

  /* Clear log */
  .clear-log {
    background: none; border: 1px solid var(--surface2); color: var(--text2);
    padding: 10px 20px; border-radius: 10px; font-size: 13px; cursor: pointer;
    display: block; margin: 12px auto 0;
  }

  /* Spinner */
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error { background: rgba(248,113,113,0.15); border: 1px solid var(--red); border-radius: 12px; padding: 14px; margin: 12px 0; font-size: 14px; color: var(--red); display: none; }
  .error.visible { display: block; }

  /* Notice (success banner) */
  .notice { background: rgba(74,222,128,0.12); border: 1px solid var(--green); border-radius: 12px; padding: 14px; margin: 12px 0; font-size: 14px; color: var(--green); display: none; }
  .notice.visible { display: block; }

  /* Activity line (Watch data) */
  .activity-line {
    background: var(--surface); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 10px; font-size: 13px; color: var(--text2); text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Macro<span>Snap</span></h1>
  <p>Snap a meal, get the macros</p>
</div>

<div class="setup" id="setup">
  <div class="setup-header" onclick="toggleSetup()">
    <span>⚙️ Settings</span>
    <span class="chev" id="setupChevron">▾</span>
  </div>
  <div class="setup-body" id="setupBody">
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API key here" autocomplete="off">
    <label style="margin-top:12px;">Model</label>
    <select id="modelSelect">
      <option value="gemini-3.5-flash">Gemini 3.5 Flash (recommended)</option>
      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite (fastest)</option>
    </select>
    <label style="margin-top:12px;">Daily Targets — Weekdays (optional)</label>
    <div class="target-row">
      <input type="number" id="targetCal" placeholder="Calories" inputmode="numeric">
      <input type="number" id="targetPro" placeholder="Protein (g)" inputmode="numeric">
    </div>
    <label style="margin-top:12px;">Weekend Targets (blank = same as weekdays)</label>
    <div class="target-row">
      <input type="number" id="targetCalWe" placeholder="Calories" inputmode="numeric">
      <input type="number" id="targetProWe" placeholder="Protein (g)" inputmode="numeric">
    </div>
    <div class="hint">
      Free API key from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.
      Your key stays on this device only.
    </div>
  </div>
</div>

<div class="templates" id="templates" style="display:none;">
  <h3>Quick Log</h3>
  <div id="templateChips"></div>
</div>

<div class="desc-area">
  <textarea id="foodDesc" rows="2" placeholder="Optional: describe the meal (e.g. &quot;grilled chicken with rice, about 6oz chicken&quot;)"></textarea>
  <button class="desc-clear" id="descClear" onclick="clearDesc()" aria-label="Clear description">✕</button>
  <button class="secondary-btn" id="descLogBtn" style="width:100%; margin-top:8px;" onclick="analyzeFromText()">✍️ Log from Description (no photo)</button>
</div>

<div class="capture-area">
  <button class="capture-btn" id="captureBtn" onclick="document.getElementById('fileInput').click()">
    📸 Take a Photo
  </button>
  <button class="capture-btn library-btn" id="libraryBtn" onclick="document.getElementById('libraryInput').click()">
    🖼️ Choose from Camera Roll
  </button>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
  <input type="file" id="libraryInput" accept="image/*">
</div>

<div class="preview-container" id="preview">
  <img id="previewImg" alt="Meal preview">
  <button class="secondary-btn reanalyze-btn" id="reanalyzeBtn" style="display:none;" onclick="reanalyze()">🔄 Re-analyze this photo</button>
</div>

<div class="error" id="error"></div>
<div class="notice" id="notice"></div>

<div class="results" id="results">
  <div class="results-card">
    <div class="meal-name" id="mealName"></div>
    <div class="meal-desc" id="mealDesc"></div>
    <div class="calories-row">
      <div class="calories-num" id="totalCals">0</div>
      <div class="calories-label">calories</div>
    </div>
    <div class="macros-grid">
      <div class="macro-item carbs">
        <div class="macro-value" id="carbsVal">0g</div>
        <div class="macro-label">Carbs</div>
      </div>
      <div class="macro-item protein">
        <div class="macro-value" id="proteinVal">0g</div>
        <div class="macro-label">Protein</div>
      </div>
      <div class="macro-item fat">
        <div class="macro-value" id="fatVal">0g</div>
        <div class="macro-label">Fat</div>
      </div>
      <div class="macro-item fiber">
        <div class="macro-value" id="fiberVal">0g</div>
        <div class="macro-label">Fiber</div>
      </div>
    </div>
    <div class="items-list" id="itemsList"></div>
    <div class="confidence" id="confidence"></div>
    <div class="portion-row">
      <span class="portion-label">Portion eaten</span>
      <div class="portion-btns">
        <button class="portion-btn" data-f="0.25" onclick="setPortion(0.25)">¼</button>
        <button class="portion-btn" data-f="0.5" onclick="setPortion(0.5)">½</button>
        <button class="portion-btn" data-f="0.75" onclick="setPortion(0.75)">¾</button>
        <button class="portion-btn active" data-f="1" onclick="setPortion(1)">1</button>
        <button class="portion-btn" data-f="1.5" onclick="setPortion(1.5)">1½</button>
        <button class="portion-btn" data-f="2" onclick="setPortion(2)">2</button>
      </div>
    </div>
    <button class="health-btn" id="healthBtn" onclick="logToHealth()">❤️ Log to Apple Health</button>
    <div class="action-row">
      <button class="secondary-btn" onclick="saveAsTemplate()">⭐ Save Template</button>
      <button class="secondary-btn" onclick="shareCard()">📤 Share Image</button>
    </div>
  </div>
</div>

<div class="log-section" id="logSection">
  <div class="log-header">
    <button class="day-nav" id="prevDay" onclick="changeDay(-1)" aria-label="Previous day">‹</button>
    <h2 id="logTitle">Today's Log</h2>
    <button class="day-nav" id="nextDay" onclick="changeDay(1)" disabled aria-label="Next day">›</button>
  </div>
  <div class="daily-total" id="dailyTotal" style="display:none;">
    <div class="daily-total-label">Daily Total</div>
    <div class="daily-total-num" id="dailyTotalCals">0</div>
    <div class="daily-total-macros" id="dailyTotalMacros"></div>
    <div id="progressWrap" style="display:none;">
      <div class="progress-row" id="calRow">
        <div class="progress-label"><span>Calories</span><span id="calLabel"></span></div>
        <div class="progress-bar"><div class="progress-fill" id="calFill"></div></div>
      </div>
      <div class="progress-row" id="proRow">
        <div class="progress-label"><span>Protein</span><span id="proLabel"></span></div>
        <div class="progress-bar"><div class="progress-fill" id="proFill"></div></div>
      </div>
    </div>
  </div>
  <div class="activity-line" id="activityLine" style="display:none;"></div>
  <div id="logEntries"><div class="log-empty">No meals logged yet today</div></div>
  <button class="clear-log" id="clearLogBtn" style="display:none;" onclick="clearLog()">Clear This Day's Log</button>
</div>

<div class="week-section">
  <h2>This Week</h2>
  <div class="week-summary" id="weekSummary"></div>
  <div class="week-toggle">
    <button class="wt-btn active" id="wtCal" onclick="setWeekMetric('cal')">Calories</button>
    <button class="wt-btn" id="wtPro" onclick="setWeekMetric('pro')">Protein</button>
  </div>
  <div id="weekChart"></div>
  <div class="action-row" style="margin-top:12px;">
    <button class="secondary-btn" onclick="shareCoachingLog(7)">📋 7 Days</button>
    <button class="secondary-btn" onclick="shareCoachingLog(EXPORT_DAYS)">📋 14 Days</button>
    <button class="secondary-btn" onclick="shareCoachingLog(0)">🗂️ All</button>
  </div>
  <div class="action-row" style="margin-top:10px;">
    <button class="secondary-btn" onclick="importActivityFromClipboard()">📥 Import Activity</button>
    <button class="secondary-btn" onclick="logWeight()">⚖️ Log Weight</button>
  </div>
</div>

<script>
async function callGemini(model, reqParts, apiKey) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: reqParts }],
      generationConfig: {
        temperature: 0.3,
        maxOutputTokens: 8192
      }
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const e = new Error(err?.error?.message || `API error ${res.status}`);
    e.status = res.status;
    throw e;
  }
  return res.json();
}

// Capacity/quota errors that justify falling back to another model
function isCapacityError(e) {
  return e.status === 503 || e.status === 429 ||
    /high demand|overloaded|resource.{0,2}exhausted|quota/i.test(e.message || '');
}

function buildPrompt(userDesc, hasImage) {
  let intro;
  if (hasImage) {
    let extra = '';
    if (userDesc) {
      extra = `\n\nThe user describes this meal as: "${userDesc}"\nUse this description to improve your identification and portion estimates. The description takes priority over visual guesses when there is ambiguity.`;
    }
    intro = `You are a nutrition analyst. Analyze this meal photo and estimate the macronutrients.${extra}`;
  } else {
    intro = `You are a nutrition analyst. No photo is provided. Estimate the macronutrients from this meal description alone: "${userDesc}"\nUse standard nutrition data for known branded/packaged foods, and typical serving sizes when quantities aren't given.`;
  }
  return `${intro}

Respond ONLY with valid JSON in this exact format, no markdown, no code fences:
{
  "meal_name": "Short descriptive name",
  "description": "Brief description of what you see",
  "calories": 500,
  "carbs_g": 60,
  "protein_g": 30,
  "fat_g": 15,
  "fiber_g": 8,
  "confidence": "medium",
  "items": [
    {"name": "Item 1", "calories": 250, "fat_g": 12},
    {"name": "Item 2", "calories": 250, "fat_g": 3}
  ]
}

Rules:
- Estimate portions based on typical serving sizes and, when a photo is provided, visual cues (plate size, utensils for scale)
- If a credit card, ruler, or other known-size object is visible in the photo, use it as a scale reference to calibrate portion sizes (a standard credit card is 8.6 x 5.4 cm)
- Brightly colored solid-tone plates with concentric rings are Fiesta dinnerware: dinner plates are 26.7 cm in diameter, smaller luncheon plates are 22.9 cm
- "confidence" must be "high", "medium", or "low"
- "fiber_g" is dietary fiber in grams
- Break down individual items when possible, including each item's fat grams ("fat_g")
- If you cannot identify the food (or the description is too vague), return: {"error": "Could not identify the food"}
- All numbers should be integers`;
}

// Escape model-provided text before injecting into HTML
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Per-day target snapshots ---
function isWeekendKey(logKey) {
  const d = new Date(logKey.replace('macrosnap_log_', '') + 'T12:00:00');
  return d.getDay() === 0 || d.getDay() === 6;
}
// What the CURRENT settings say the target is for a given date (weekend-aware)
function currentTargetsForKey(logKey) {
  const we = isWeekendKey(logKey);
  const cal = (we && parseInt(localStorage.getItem('macrosnap_target_cal_we'))) ||
              parseInt(localStorage.getItem('macrosnap_target_cal')) || 0;
  const pro = (we && parseInt(localStorage.getItem('macrosnap_target_pro_we'))) ||
              parseInt(localStorage.getItem('macrosnap_target_pro')) || 0;
  return { cal, pro };
}
function targetsKeyFor(logKey) {
  return logKey.replace('macrosnap_log_', 'macrosnap_targets_');
}
// Record today's effective targets (called on every log write and settings change)
function snapshotTargets(offset) {
  const logKey = getKeyFor(offset);
  localStorage.setItem(targetsKeyFor(logKey), JSON.stringify(currentTargetsForKey(logKey)));
}
// What the target WAS on a given day (snapshot), falling back to current
// settings for days logged before snapshots existed
function getTargetsFor(logKey) {
  try {
    const t = JSON.parse(localStorage.getItem(targetsKeyFor(logKey)));
    if (t) return { cal: t.cal || 0, pro: t.pro || 0 };
  } catch {}
  return currentTargetsForKey(logKey);
}

// --- Photo selection (camera and library share one handler) ---
let lastImage = null;        // {data, mime} of the most recent photo
let lastPhotoLoggedId = null; // log entry id created by the last photo analysis
let lastResult = null;       // currently displayed (possibly portion-scaled) result
let baseResult = null;       // unscaled result, basis for portion scaling
let currentEntryId = null;   // log entry id for the currently displayed result

// --- Portion scaling ---
function scaleResult(r, f) {
  return {
    ...r,
    calories: Math.round((r.calories || 0) * f),
    carbs_g: Math.round((r.carbs_g || 0) * f),
    protein_g: Math.round((r.protein_g || 0) * f),
    fat_g: Math.round((r.fat_g || 0) * f),
    fiber_g: Math.round((r.fiber_g || 0) * f),
    items: (r.items || []).map(i => {
      const s = { ...i, calories: Math.round((i.calories || 0) * f) };
      if (i.fat_g != null) s.fat_g = Math.round(i.fat_g * f);
      return s;
    })
  };
}

function highlightPortion(f) {
  document.querySelectorAll('.portion-btn').forEach(b =>
    b.classList.toggle('active', parseFloat(b.dataset.f) === f));
}

function setPortion(f) {
  if (!baseResult) return;
  const scaled = scaleResult(baseResult, f);
  lastResult = scaled;
  displayResults(scaled);
  highlightPortion(f);
  // Update the already-logged entry to match (entries are always logged to today)
  if (currentEntryId !== null) {
    const key = getTodayKey();
    const log = getLogFor(key);
    const e = log.find(en => en.id === currentEntryId);
    if (e) {
      e.calories = scaled.calories;
      e.carbs = scaled.carbs_g;
      e.protein = scaled.protein_g;
      e.fat = scaled.fat_g;
      e.fiber = scaled.fiber_g;
      e.items = (scaled.items || []).map(i => ({ name: i.name, calories: i.calories, fat: i.fat_g }));
      saveLogFor(key, log);
      renderLog();
    }
  }
}

async function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  const key = apiKeyInput.value.trim();
  if (!key) {
    showError('Please enter your Gemini API key first.');
    return;
  }

  const reader = new FileReader();
  reader.onload = async (ev) => {
    const base64Full = ev.target.result;
    const base64Data = base64Full.split(',')[1];
    const mimeType = file.type || 'image/jpeg';

    lastImage = { data: base64Data, mime: mimeType };
    lastPhotoLoggedId = null;

    document.getElementById('previewImg').src = base64Full;
    document.getElementById('preview').classList.add('visible');
    document.getElementById('reanalyzeBtn').style.display = 'block';
    document.getElementById('results').classList.remove('visible');
    hideError();

    const desc = document.getElementById('foodDesc').value.trim();
    await analyzeMeal(base64Data, mimeType, key, desc, document.getElementById('captureBtn'), '📸 Take a Photo');
  };

  // Reset so same file can be re-selected
  e.target.value = '';
}

document.getElementById('libraryInput').addEventListener('change', handleFileSelect);

// Re-run analysis on the same photo (e.g. after editing the description,
// or retrying when the Gemini server was busy). Replaces the entry the
// first analysis logged, so you don't get duplicates.
async function reanalyze() {
  if (!lastImage) return;
  const key = apiKeyInput.value.trim();
  if (!key) {
    showError('Please enter your Gemini API key first.');
    return;
  }
  if (lastPhotoLoggedId !== null) {
    const key = getTodayKey();
    saveLogFor(key, getLogFor(key).filter(en => en.id !== lastPhotoLoggedId));
    lastPhotoLoggedId = null;
    renderLog();
  }
  hideError();
  const desc = document.getElementById('foodDesc').value.trim();
  await analyzeMeal(lastImage.data, lastImage.mime, key, desc, document.getElementById('captureBtn'), '📸 Take a Photo');
}

// Works with or without a photo: pass base64Data = null for description-only analysis.
async function analyzeMeal(base64Data, mimeType, apiKey, userDesc, btn, idleLabel) {
  btn.classList.add('loading');
  btn.innerHTML = '<span class="spinner"></span>Analyzing...';

  const reqParts = base64Data
    ? [{ inline_data: { mime_type: mimeType, data: base64Data } }, { text: buildPrompt(userDesc, true) }]
    : [{ text: buildPrompt(userDesc, false) }];

  try {
    // Try the selected model first; on capacity errors (503/429), fall back to the others
    const selected = modelSelect.value;
    const modelsToTry = [selected, ...VALID_MODELS.filter(m => m !== selected)];
    let data = null, usedModel = selected;
    for (let i = 0; i < modelsToTry.length; i++) {
      try {
        data = await callGemini(modelsToTry[i], reqParts, apiKey);
        usedModel = modelsToTry[i];
        break;
      } catch (e) {
        if (i < modelsToTry.length - 1 && isCapacityError(e)) continue;
        throw e;
      }
    }
    const parts = data.candidates?.[0]?.content?.parts || [];
    const text = parts.filter(p => p.text && !p.thought).map(p => p.text).join('');
    if (!text) throw new Error('No response from Gemini');

    // Clean potential markdown fences
    const cleaned = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    const result = JSON.parse(cleaned);

    if (result.error) {
      showError(result.error);
      return;
    }

    lastResult = result;
    baseResult = result;
    displayResults(result);
    highlightPortion(1);
    if (usedModel !== selected) {
      const conf = document.getElementById('confidence');
      conf.textContent = (conf.textContent ? conf.textContent + ' · ' : '') +
        `⚡ used ${usedModel.replace('gemini-', '')} (${selected.replace('gemini-', '')} was busy)`;
    }
    lastPhotoLoggedId = addToLog(result);
    currentEntryId = lastPhotoLoggedId;

  } catch (err) {
    showError(err.message);
  } finally {
    btn.classList.remove('loading');
    btn.innerHTML = idleLabel;
  }
}

// --- Share meal card as image ---
function shareCard() {
  if (!lastResult) return;
  const r = lastResult;
  const items = (r.items || []).slice(0, 6);
  const W = 720;
  const itemsH = items.length ? items.length * 44 + 50 : 0;
  const H = 470 + itemsH + 70;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const font = '-apple-system, BlinkMacSystemFont, sans-serif';

  function box(bx, by, bw, bh, fill) {
    x.fillStyle = fill;
    if (x.roundRect) { x.beginPath(); x.roundRect(bx, by, bw, bh, 14); x.fill(); }
    else x.fillRect(bx, by, bw, bh);
  }

  // Background
  x.fillStyle = '#0f172a';
  x.fillRect(0, 0, W, H);

  x.textAlign = 'center';
  // Branding
  x.font = `bold 30px ${font}`;
  x.fillStyle = '#22d3ee';
  x.fillText('MacroSnap', W / 2, 56);
  // Meal name (truncate to fit)
  let name = String(r.meal_name || 'Meal');
  x.font = `bold 36px ${font}`;
  while (x.measureText(name).width > W - 80 && name.length > 4) name = name.slice(0, -2);
  x.fillStyle = '#f1f5f9';
  x.fillText(name, W / 2, 116);
  // Calories
  x.font = `800 88px ${font}`;
  x.fillStyle = '#22d3ee';
  x.fillText(String(r.calories), W / 2, 226);
  x.font = `22px ${font}`;
  x.fillStyle = '#94a3b8';
  x.fillText('calories', W / 2, 258);

  // Macro boxes
  const macros = [
    ['CARBS', (r.carbs_g ?? 0) + 'g', '#fb923c'],
    ['PROTEIN', (r.protein_g ?? 0) + 'g', '#4ade80'],
    ['FAT', (r.fat_g ?? 0) + 'g', '#a78bfa'],
    ['FIBER', (r.fiber_g ?? 0) + 'g', '#2dd4bf']
  ];
  const bw = 150, gap = 16, bx0 = (W - (bw * 4 + gap * 3)) / 2, by = 300;
  macros.forEach((m, i) => {
    const bx = bx0 + i * (bw + gap);
    box(bx, by, bw, 110, '#1e293b');
    x.font = `bold 34px ${font}`;
    x.fillStyle = m[2];
    x.fillText(m[1], bx + bw / 2, by + 58);
    x.font = `16px ${font}`;
    x.fillStyle = '#94a3b8';
    x.fillText(m[0], bx + bw / 2, by + 88);
  });

  // Items
  let y = by + 160;
  if (items.length) {
    items.forEach(it => {
      x.textAlign = 'left';
      x.font = `24px ${font}`;
      x.fillStyle = '#f1f5f9';
      let iname = String(it.name || '');
      while (x.measureText(iname).width > W - 240 && iname.length > 4) iname = iname.slice(0, -2);
      x.fillText(iname, 60, y);
      x.textAlign = 'right';
      x.fillStyle = '#94a3b8';
      x.fillText((it.calories ?? 0) + ' cal', W - 60, y);
      y += 44;
    });
  }

  // Footer date
  x.textAlign = 'center';
  x.font = `20px ${font}`;
  x.fillStyle = '#64748b';
  x.fillText(new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }), W / 2, H - 28);

  c.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], 'macrosnap-meal.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { /* user cancelled */ }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'macrosnap-meal.png';
      a.click();
    }
  }, 'image/png');
}

// --- Food Log (localStorage, per-day, local time) ---
let viewOffset = 0; // 0 = today, -1 = yesterday, etc. Logging always writes to today.

function getKeyFor(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const pad = n => String(n).padStart(2, '0');
  return `macrosnap_log_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function getTodayKey() { return getKeyFor(0); }

function getLogFor(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; }
  catch { return []; }
}
function saveLogFor(key, log) {
  localStorage.setItem(key, JSON.stringify(log));
}

// --- Apple Watch activity (ingested via URL from the "MacroSnap Activity" Shortcut) ---
// URL format: #activity=YYYY-MM-DD,steps,restingHR,exerciseMin,activeEnergy
// Multiple days may be sent separated by ";".
function ingestActivityString(str) {
  let count = 0;
  String(str).split(/[;\n]+/).forEach(entry => {
    const p = entry.trim().split(',');
    if (p.length < 5) return;
    const date = p[0].trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const nums = p.slice(1, 5).map(v => Math.round(parseFloat(v)) || 0);
    localStorage.setItem('macrosnap_activity_' + date,
      JSON.stringify({ steps: nums[0], rhr: nums[1], ex: nums[2], ae: nums[3] }));
    count++;
  });
  return count;
}

function ingestActivityFromUrl() {
  const m = location.hash.match(/#activity=(.+)/);
  if (!m) return;
  const count = ingestActivityString(decodeURIComponent(m[1]));
  history.replaceState(null, '', location.pathname + location.search);
  if (count) showNotice(`✓ Watch activity saved for ${count} day${count > 1 ? 's' : ''}`);
}

// Clipboard import — the reliable path into the installed home-screen app
// (iOS gives the PWA separate storage from Safari, so URL delivery can't reach it)
async function importActivityFromClipboard() {
  try {
    const txt = await navigator.clipboard.readText();
    const count = ingestActivityString(txt || '');
    if (count) {
      showNotice(`✓ Watch activity saved for ${count} day${count > 1 ? 's' : ''}`);
      hideError();
      renderLog();
    } else {
      showError('Clipboard doesn\'t look like activity data. Run the "MacroSnap Activity" Shortcut first (expects: YYYY-MM-DD,steps,RHR,exerciseMin,activeCal).');
    }
  } catch {
    showError('Could not read the clipboard.');
  }
}

function dayLabel(offset) {
  if (offset === 0) return "Today's Log";
  if (offset === -1) return 'Yesterday';
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

function changeDay(delta) {
  viewOffset = Math.min(0, viewOffset + delta);
  renderLog();
}

function addToLog(result) {
  const key = getTodayKey();
  const log = getLogFor(key);
  const id = Date.now();
  log.push({
    id,
    name: result.meal_name,
    calories: result.calories,
    carbs: result.carbs_g,
    protein: result.protein_g,
    fat: result.fat_g,
    fiber: result.fiber_g ?? 0,
    items: (result.items || []).map(i => ({ name: i.name, calories: i.calories, fat: i.fat_g })),
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });
  saveLogFor(key, log);
  snapshotTargets(0); // record what the goals were on this day
  viewOffset = 0; // jump back to today so the new entry is visible
  renderLog();
  return id;
}

function renderLog() {
  const log = getLogFor(getKeyFor(viewOffset));
  const container = document.getElementById('logEntries');
  const totalEl = document.getElementById('dailyTotal');
  const clearBtn = document.getElementById('clearLogBtn');

  document.getElementById('logTitle').textContent = dayLabel(viewOffset);
  document.getElementById('nextDay').disabled = viewOffset === 0;

  // Weight + Watch activity for the viewed day (shows even on days with no meals)
  const act = getActivityFor(getKeyFor(viewOffset));
  const wt = getWeightFor(getKeyFor(viewOffset));
  const actEl = document.getElementById('activityLine');
  const bits = [];
  if (wt) bits.push(`⚖️ ${wt} lb`);
  if (act) bits.push(`👟 ${(act.steps || 0).toLocaleString()} steps · 🔥 ${act.ae || 0} active cal · 🏃 ${act.ex || 0} min exercise · ❤️ ${act.rhr || 0} RHR`);
  if (bits.length) {
    actEl.style.display = 'block';
    actEl.textContent = bits.join(' · ');
  } else {
    actEl.style.display = 'none';
  }

  if (log.length === 0) {
    container.innerHTML = `<div class="log-empty">No meals logged ${viewOffset === 0 ? 'yet today' : 'this day'}</div>`;
    totalEl.style.display = 'none';
    clearBtn.style.display = 'none';
    renderWeek();
    return;
  }

  let tCal = 0, tCarb = 0, tPro = 0, tFat = 0, tFib = 0;
  container.innerHTML = log.map((e, i) => {
    tCal += e.calories; tCarb += e.carbs; tPro += e.protein; tFat += e.fat; tFib += e.fiber || 0;
    return `<div class="log-entry">
      <div class="log-entry-left">
        <div class="log-entry-name">${esc(e.name)}</div>
        <div class="log-entry-time">${esc(e.time)}</div>
      </div>
      <div class="log-entry-right">
        <div class="log-entry-cals">${esc(e.calories)}</div>
        <div class="log-entry-macros">C${esc(e.carbs)}g · P${esc(e.protein)}g · F${esc(e.fat)}g · Fb${esc(e.fiber || 0)}g</div>
      </div>
      <div class="entry-actions">
        <button class="entry-btn" onclick="editEntry(${i})" aria-label="Edit">✎</button>
        <button class="entry-btn" onclick="deleteEntry(${i})" aria-label="Delete">✕</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('dailyTotalCals').textContent = tCal;
  document.getElementById('dailyTotalMacros').textContent = `C ${tCarb}g · P ${tPro}g · F ${tFat}g · Fb ${tFib}g`;
  totalEl.style.display = 'block';
  clearBtn.style.display = 'block';

  renderProgress(tCal, tPro);
  renderWeek();
}

// --- Weekly trends + summary ---
let weekMetric = 'cal';

function setWeekMetric(m) {
  weekMetric = m;
  document.getElementById('wtCal').classList.toggle('active', m === 'cal');
  document.getElementById('wtPro').classList.toggle('active', m === 'pro');
  renderWeek();
}

function renderWeek() {
  const days = [];
  for (let o = -6; o <= 0; o++) {
    const key = getKeyFor(o);
    const log = getLogFor(key);
    const t = getTargetsFor(key);
    const d = new Date();
    d.setDate(d.getDate() + o);
    days.push({
      label: d.toLocaleDateString(undefined, { weekday: 'narrow' }),
      cal: log.reduce((s, e) => s + (e.calories || 0), 0),
      pro: log.reduce((s, e) => s + (e.protein || 0), 0),
      logged: log.length > 0,
      tCal: t.cal, tPro: t.pro
    });
  }

  // Summary — excludes today: a partial day would skew averages down.
  // Each day is judged against ITS OWN target (per-day snapshots).
  const logged = days.slice(0, 6).filter(d => d.logged);
  let html;
  if (logged.length === 0) {
    html = 'Averages appear once you have a full day logged (today is excluded until it\'s complete).';
  } else {
    const avgCal = Math.round(logged.reduce((s, d) => s + d.cal, 0) / logged.length);
    const avgPro = Math.round(logged.reduce((s, d) => s + d.pro, 0) / logged.length);
    html = `Past ${logged.length} full day${logged.length > 1 ? 's' : ''}: avg <b>${avgCal}</b> cal · <b>${avgPro}g</b> protein per day`;
    const hits = [];
    const calDays = logged.filter(d => d.tCal);
    const proDays = logged.filter(d => d.tPro);
    if (calDays.length) hits.push(`calories at/under target <b>${calDays.filter(d => d.cal <= d.tCal).length}/${calDays.length}</b> days`);
    if (proDays.length) hits.push(`protein target hit <b>${proDays.filter(d => d.pro >= d.tPro).length}/${proDays.length}</b> days`);
    if (hits.length) html += '<br>' + hits.join(' · ');
  }
  document.getElementById('weekSummary').innerHTML = html;

  // Chart — per-day target ticks (targets can differ weekday vs weekend)
  const vals = days.map(d => weekMetric === 'cal' ? d.cal : d.pro);
  const targs = days.map(d => weekMetric === 'cal' ? d.tCal : d.tPro);
  const max = Math.max(...vals, ...targs, 1);
  const W = 350, H = 150, chartH = 106, top = 24;
  const bw = 34, gap = (W - 7 * bw) / 8;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">`;
  days.forEach((d, i) => {
    const v = vals[i];
    const h = Math.max(2, Math.round(v / max * chartH));
    const x = gap + i * (bw + gap);
    const y = top + chartH - (v ? h : 2);
    svg += `<rect x="${x}" y="${y}" width="${bw}" height="${v ? h : 2}" rx="4" fill="${i === 6 ? 'var(--accent)' : 'var(--surface2)'}"/>`;
    if (v) svg += `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="9" fill="var(--text2)">${v}</text>`;
    svg += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--text2)">${d.label}</text>`;
    const tg = targs[i];
    if (tg) {
      const ty = top + chartH - Math.round(Math.min(1, tg / max) * chartH);
      svg += `<line x1="${x - 2}" x2="${x + bw + 2}" y1="${ty}" y2="${ty}" stroke="var(--orange)" stroke-dasharray="3 2" stroke-width="1.5"/>`;
    }
  });
  if (targs.some(t => t)) {
    svg += `<text x="${W - 2}" y="10" text-anchor="end" font-size="9" fill="var(--orange)">‒ ‒ target</text>`;
  }
  svg += '</svg>';
  document.getElementById('weekChart').innerHTML = svg;
}

function renderProgress(cal, pro) {
  // Judge the viewed day against ITS targets, not today's
  const t = getTargetsFor(getKeyFor(viewOffset));
  const wrap = document.getElementById('progressWrap');
  if (!t.cal && !t.pro) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  setBar('calRow', 'calFill', 'calLabel', cal, t.cal);
  setBar('proRow', 'proFill', 'proLabel', pro, t.pro);
}

function setBar(rowId, fillId, labelId, value, target) {
  const row = document.getElementById(rowId);
  if (!target) { row.style.display = 'none'; return; }
  row.style.display = 'block';
  const fill = document.getElementById(fillId);
  fill.style.width = Math.min(100, (value / target) * 100) + '%';
  fill.classList.toggle('over', value > target);
  document.getElementById(labelId).textContent = `${value} / ${target}`;
}

// --- Coaching export: food history as shareable text ---
// days = number of most recent days to include; 0 = full history.
// Storage is never trimmed either way.
const EXPORT_DAYS = 14;

async function shareCoachingLog(days) {
  const cutoff = days > 0 ? getKeyFor(-(days - 1)) : '';
  // Union of days with food logs and days with Watch activity
  const dates = new Set();
  Object.keys(localStorage).forEach(k => {
    let d = null;
    if (k.startsWith('macrosnap_log_')) d = k.slice('macrosnap_log_'.length);
    else if (k.startsWith('macrosnap_activity_')) d = k.slice('macrosnap_activity_'.length);
    else if (k.startsWith('macrosnap_weight_')) d = k.slice('macrosnap_weight_'.length);
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d) && (!cutoff || 'macrosnap_log_' + d >= cutoff)) dates.add(d);
  });
  const keys = [...dates].sort().map(d => 'macrosnap_log_' + d);
  let out = `MacroSnap food log (${days > 0 ? `last ${days} days` : 'full history'})\n`;
  const wdC = localStorage.getItem('macrosnap_target_cal'), wdP = localStorage.getItem('macrosnap_target_pro');
  const weC = localStorage.getItem('macrosnap_target_cal_we'), weP = localStorage.getItem('macrosnap_target_pro_we');
  if (wdC || wdP) out += `Current targets — weekdays: ${wdC || '–'} cal, ${wdP || '–'}g protein; weekends: ${weC || wdC || '–'} cal, ${weP || wdP || '–'}g protein\n`;
  out += 'Each day below shows the target that was in effect ON that day (goals may have changed over time).\n';
  out += 'Units: grams. C=carbs, P=protein, F=fat, Fb=fiber. RHR=resting heart rate (bpm), from Apple Watch.\n\n';

  let daysOut = 0;
  keys.forEach(k => {
    const log = getLogFor(k);
    const act = getActivityFor(k);
    const wt = getWeightFor(k);
    if (!log.length && !act && !wt) return;
    daysOut++;
    const dateStr = k.replace('macrosnap_log_', '');
    const d = new Date(dateStr + 'T12:00:00');
    const label = isNaN(d) ? dateStr : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    let tCal = 0, tC = 0, tP = 0, tF = 0, tFb = 0;
    const lines = log.map(e => {
      tCal += e.calories; tC += e.carbs; tP += e.protein; tF += e.fat; tFb += e.fiber || 0;
      let line = `- ${e.time} ${e.name}: ${e.calories} cal (C${e.carbs} P${e.protein} F${e.fat} Fb${e.fiber || 0})`;
      if (e.items && e.items.length > 1) {
        line += '\n' + e.items.map(i => `    · ${i.name}: ${i.calories} cal${i.fat != null ? ` (${i.fat}g fat)` : ''}`).join('\n');
      }
      return line;
    });
    const dt = getTargetsFor(k);
    const tgStr = (dt.cal || dt.pro)
      ? ` [target: ${dt.cal ? dt.cal + ' cal' : ''}${dt.cal && dt.pro ? ', ' : ''}${dt.pro ? dt.pro + 'g protein' : ''}]`
      : '';
    if (log.length) {
      out += `${label} — total ${tCal} cal (C${tC} P${tP} F${tF} Fb${tFb})${tgStr}\n`;
    } else {
      out += `${label} — no meals logged${tgStr}\n`;
    }
    if (wt) {
      out += `  Weight: ${wt} lb\n`;
    }
    if (act) {
      out += `  Activity: ${act.steps || 0} steps, ${act.ae || 0} active cal, ${act.ex || 0} exercise min, ${act.rhr || 0} RHR\n`;
    }
    if (lines.length) out += lines.join('\n') + '\n';
    out += '\n';
  });

  if (daysOut === 0) {
    showError('No logged meals to export yet.');
    return;
  }

  try {
    if (navigator.share) {
      await navigator.share({ text: out });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return; // user closed the share sheet
  }
  try {
    await navigator.clipboard.writeText(out);
    alert('Food log copied to clipboard.');
  } catch {
    alert('Could not open the share sheet or copy to clipboard.');
  }
}

function editEntry(i) {
  const key = getKeyFor(viewOffset);
  const log = getLogFor(key);
  const e = log[i];
  if (!e) return;
  const name = prompt('Meal name:', e.name); if (name === null) return;
  const cal = prompt('Calories:', e.calories); if (cal === null) return;
  const pro = prompt('Protein (g):', e.protein); if (pro === null) return;
  const carb = prompt('Carbs (g):', e.carbs); if (carb === null) return;
  const fat = prompt('Fat (g):', e.fat); if (fat === null) return;
  const fib = prompt('Fiber (g):', e.fiber ?? 0); if (fib === null) return;
  e.name = name.trim() || e.name;
  e.calories = parseInt(cal) || 0;
  e.protein = parseInt(pro) || 0;
  e.carbs = parseInt(carb) || 0;
  e.fat = parseInt(fat) || 0;
  e.fiber = parseInt(fib) || 0;
  saveLogFor(key, log);
  renderLog();
}

function deleteEntry(i) {
  if (!confirm('Delete this entry?')) return;
  const key = getKeyFor(viewOffset);
  const log = getLogFor(key);
  log.splice(i, 1);
  saveLogFor(key, log);
  renderLog();
}

function clearLog() {
  if (confirm('Clear this day\'s log?')) {
    localStorage.removeItem(getKeyFor(viewOffset));
    renderLog();
  }
}

function showError(msg) { const el = document.getElementById('error'); el.textContent = msg; el.classList.add('visible'); }
function hideError() { document.getElementById('error').classList.remove('visible'); }
function showNotice(msg) {
  const el = document.getElementById('notice');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 6000);
}

ingestActivityFromUrl(); // pick up #activity= data from the Shortcut, if present

renderTemplates();

  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
